name: Studio contracts takeover verification
# Temporary branch-local verification, not a product startup or release gate.
on:
  push:
    branches: [feat/studio-contracts-takeover-20260922]
    paths: [product-studio/**, skydiving-legos/**, link-product/**, showcase-product/**, studio.workspace.json, .github/workflows/studio-contracts-takeover.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'adelost/circlekit' && github.ref == 'refs/heads/feat/studio-contracts-takeover-20260922'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Install locked Studio dependencies
        working-directory: product-studio
        run: npm ci --ignore-scripts
      - name: Read the pinned public grammar owner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: adelost/agentmux
          ref: e34b7358041442c7dc4e0d57df5a778390eefa56
          path: .verification-amux
          persist-credentials: false
      - name: Install locked grammar dependencies without hooks
        working-directory: .verification-amux
        run: npm ci --ignore-scripts
      - name: Prepare public-source verification archive
        run: |
          mkdir -p "$RUNNER_TEMP/studio-verification/circlekit" "$RUNNER_TEMP/studio-verification/agentmux"
          git archive HEAD product-studio product-spec product-emit skydiving-legos link-product showcase-product bddkit README.md | tar -x -C "$RUNNER_TEMP/studio-verification/circlekit"
          git -C .verification-amux archive HEAD | tar -x -C "$RUNNER_TEMP/studio-verification/agentmux"
          cp -a product-studio/node_modules "$RUNNER_TEMP/studio-verification/circlekit/product-studio/"
          cp -a .verification-amux/node_modules "$RUNNER_TEMP/studio-verification/agentmux/"
          git rev-parse HEAD > "$RUNNER_TEMP/studio-verification/circlekit.commit"
          git -C .verification-amux rev-parse HEAD > "$RUNNER_TEMP/studio-verification/agentmux.commit"
          tar -czf "$RUNNER_TEMP/studio-public-verification.tgz" -C "$RUNNER_TEMP/studio-verification" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-verification-workspace
          path: ${{ runner.temp }}/studio-public-verification.tgz
          retention-days: 1
      - name: Syntax and unit contracts
        id: unit
        working-directory: product-studio
        run: npm run verify
      - name: Actual AMUX grammar and selected service sources
        if: ${{ !cancelled() }}
        working-directory: product-studio
        run: node scripts/verify-amux-contracts.mjs ../.verification-amux
      - name: Install direct browser runner
        if: ${{ !cancelled() }}
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Direct browser acceptance
        if: ${{ !cancelled() }}
        working-directory: product-studio
        run: |
          node server.mjs --port 4317 --data-dir "$RUNNER_TEMP/studio-drafts" > "$RUNNER_TEMP/studio-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4317/api/bootstrap >/dev/null && break; sleep 1; done
          failed=0
          python test/browser.py || failed=1
          python test/browser_experience.py || failed=1
          python test/browser_extended.py || failed=1
          python test/browser_documentation.py || failed=1
          exit "$failed"
      - name: Preserve browser receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-receipts
          path: product-studio/test-results/
          retention-days: 7
