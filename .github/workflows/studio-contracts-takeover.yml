name: Studio contracts takeover verification
# Branch-local development verification, never a product startup or release gate.
on:
  push:
    branches: [feat/studio-contracts-takeover-20260922]
    paths: [product-studio/**, skydiving-legos/**, link-product/**, showcase-product/**, studio.workspace.json, studio.mjs, .github/workflows/studio-contracts-takeover.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'adelost/circlekit' && github.ref == 'refs/heads/feat/studio-contracts-takeover-20260922'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Install locked Studio dependencies
        working-directory: product-studio
        run: npm ci --ignore-scripts
      - name: Read the isolated public AMUX companion
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: adelost/agentmux
          ref: 2c6991f954f58207c1918067809a4e027356166c
          path: .verification-amux
          persist-credentials: false
      - name: Install locked grammar dependencies without hooks
        working-directory: .verification-amux
        run: npm ci --ignore-scripts
      - name: Fetch immutable public compiler inputs for consumer-version verification
        run: |
          mkdir -p "$RUNNER_TEMP/compiler-inputs"
          for version in 0.3.52 0.3.64; do
            curl --fail --silent --show-error --location "https://circlekit.pages.dev/npm/v1d/product-spec/$version/v1d-product-spec-$version.tgz" -o "$RUNNER_TEMP/compiler-inputs/product-spec-$version.tgz"
          done
          cd "$RUNNER_TEMP/compiler-inputs"
          sha512sum *.tgz > SHA512SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiler-verification-inputs
          path: ${{ runner.temp }}/compiler-inputs/
          retention-days: 1
      - name: Syntax and unit contracts
        working-directory: product-studio
        run: |
          npm run verify
          node --check ../studio.mjs
      - name: Actual AMUX grammar and selected service sources
        if: ${{ !cancelled() }}
        working-directory: product-studio
        run: node scripts/verify-amux-contracts.mjs ../.verification-amux
      - name: Read pinned SKYVW native takeover
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: adelost/skydive-altimeter
          ref: 1eb1476a32324c13d9fec82c0ccc8c375ced1a81
          path: .verification-skyvw-native
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /studio.mjs
            /studio.workspace.json
            /STUDIO-CONTRACTS.md
            /appspec/products/skyvw/
            /appspec/generated/skyvw/
            /appspec/package-lock.json
            /app/src/main/java/com/adelost/skydivealtimeter/appspec/generated/GeneratedSkyvwNativeLegoCatalogPortIds.kt
      - name: Read pinned SKYVW web takeover
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: adelost/skyvw-web
          ref: b4b00b344151647be7cc35bea24173451a9cc5ed
          path: .verification-skyvw-web
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /studio.mjs
            /studio.workspace.json
            /STUDIO-CONTRACTS.md
            /package.json
            /package-lock.json
            /scripts/export-studio.mjs
            /src/logbook/
      - name: SKYVW native source and artifact smoke
        if: ${{ !cancelled() }}
        working-directory: .verification-skyvw-native
        env:
          STUDIO_ROOT: ${{ github.workspace }}/product-studio
          AMUX_ROOT: ${{ github.workspace }}/.verification-amux
        run: |
          node studio.mjs check
          node studio.mjs doctor --product skyvw --pretty
      - name: Install SKYVW web locked dependencies
        if: ${{ !cancelled() }}
        working-directory: .verification-skyvw-web
        run: npm ci --ignore-scripts
      - name: SKYVW web source check and explicit graph export
        if: ${{ !cancelled() }}
        working-directory: .verification-skyvw-web
        env:
          STUDIO_ROOT: ${{ github.workspace }}/product-studio
          AMUX_ROOT: ${{ github.workspace }}/.verification-amux
        run: |
          node studio.mjs check
          node scripts/export-studio.mjs
          node studio.mjs doctor --product skyvw-web-logbook --pretty
      - name: Verify SKYVW intent, declared facts and legacy separation
        if: ${{ !cancelled() }}
        working-directory: product-studio
        run: node scripts/verify-skyvw-integration.mjs ../.verification-skyvw-native ../.verification-skyvw-web ../.verification-amux
      - name: Install direct browser runner
        if: ${{ !cancelled() }}
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Direct browser acceptance
        if: ${{ !cancelled() }}
        working-directory: product-studio
        run: |
          node server.mjs --port 4317 --data-dir "$RUNNER_TEMP/studio-drafts" > "$RUNNER_TEMP/studio-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4317/api/bootstrap >/dev/null && break; sleep 1; done
          failed=0
          python test/browser.py || failed=1
          python test/browser_experience.py || failed=1
          python test/browser_extended.py || failed=1
          python test/browser_documentation.py || failed=1
          exit "$failed"
      - name: Preserve browser receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-receipts
          path: product-studio/test-results/
          retention-days: 7
