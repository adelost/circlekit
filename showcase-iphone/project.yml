name: CircleKitShowcase
options:
  bundleIdPrefix: io.v1d.circlekit
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  CircleKitShowcase:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.v1d.circlekit.showcase
        PRODUCT_NAME: CircleKit Showcase
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CircleKit
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
  CircleKitShowcaseWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.v1d.circlekit.showcase.watch
        PRODUCT_NAME: CircleKit Showcase
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CircleKit
        INFOPLIST_KEY_WKApplication: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  CircleKitShowcase:
    build:
      targets:
        CircleKitShowcase: all
    run:
      config: Debug
  CircleKitShowcaseWatch:
    build:
      targets:
        CircleKitShowcaseWatch: all
    run:
      config: Debug
